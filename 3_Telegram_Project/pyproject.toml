[project]
name = "sharayia-telegram-bot"
version = "1.0.0"
description = "Telegram bot for Sharayia Stocks"
requires-python = ">=3.11"

dependencies = [
    "requests==2.32.3",
    "google-auth==2.35.0",
    "google-auth-oauthlib==1.2.1",
    "google-api-python-client==2.149.0",
    "python-dateutil==2.9.0",
]

[tool.vercel]
entrypoint = "api.webhook:handler"